[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    # Starlette 1.6 deprecates `httpx` with `starlette.testclient` in favour of
    # `httpx2`. FastAPI 0.141's TestClient still uses httpx; silence the
    # deprecation notice without changing the (working) test stack.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
    # anyio deprecates the BlockingPortal alias; starlette internals still use
    # it. Third-party noise only.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning