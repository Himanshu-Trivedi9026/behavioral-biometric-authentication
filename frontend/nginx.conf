# Phase 15A — nginx static-site server with SPA deep-link fallback.
#
# The app uses a hashless client-side router (history.pushState), so any
# deep link served by nginx must fall back to index.html for the router to
# take over. Asset files (hashed by Vite) are served directly and cached.
#
# This server does NOT proxy /api — the SPA talks to the backend at the
# VITE_API_BASE_URL baked at build time (see Dockerfile). No TLS is provided
# here; TLS termination is explicitly out of Phase 15A scope.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}