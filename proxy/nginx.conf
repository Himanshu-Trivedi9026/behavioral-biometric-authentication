# ---------------------------------------------------------------------------
# Phase 15B — TLS reverse proxy (the single public edge of the stack).
#
#   Browser --HTTPS--> proxy --/api/ etc--> backend:8000
#                        \---everything----> frontend:80 (SPA + deep-link
#                                              fallback + asset caching)
#
# TLS 1.2 and 1.3 only; TLS 1.0/1.1 are rejected. HTTP on :80 redirects to
# HTTPS. Basic security headers (HSTS, nosniff) are applied.
#
# /api/... must NEVER fall through to the SPA — unknown API routes return the
# backend's structured 404 JSON, not the index.html fallback.
#
# Certificates are mounted into /etc/nginx/certs/ read-only by compose.yaml
# (paths configurable via BBA_TLS_CERT_PATH / BBA_TLS_KEY_PATH).
#
# A tiny unauthenticated /nginx_health location on both listeners gives the
# container healthcheck a TLS-free, redirect-free liveness probe.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    location = /nginx_health {
        access_log off;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 + 1.3 only — TLS 1.0/1.1 are rejected outright.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Upstream headers (inherited by every proxy_pass location below).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx_health {
        access_log off;
        return 200 'ok';
    }

    # ---- backend API + operational surface -------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000;
    }

    location = /health/ready {
        proxy_pass http://backend:8000;
    }

    location = /docs {
        proxy_pass http://backend:8000;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
    }

    location = /redoc {
        proxy_pass http://backend:8000;
    }

    # ---- everything else -> frontend SPA (deep-link fallback lives there) --
    location / {
        proxy_pass http://frontend:80;
    }
}