# ---------------------------------------------------------------------------
# Phase 15A — local containerized deployment.
#
# Services: db -> migrate -> backend -> frontend
#
#   Browser
#      |  http://localhost:FRONTEND_PORT
#      v
#   frontend (nginx, static SPA)
#      \  fetch() -> VITE_API_BASE_URL (browser-reachable, http://localhost:8000)
#       v
#   backend (uvicorn backend.app.main:app)
#      \  BBA_DATABASE_URL = postgresql://...@db:5432/...
#       v
#   db (PostgreSQL, named volume)
#
# All secrets come from the developer-provided, git-ignored `.env` file (see
# .env.example). Nothing here hard-codes a real secret. `BBA_ENVIRONMENT` is
# pinned to `production` so the backend's fail-closed config validation is
# always active inside the container.
#
# Model artifacts (models/*.pt, models/*.json) are gitignored and are mounted
# READ-ONLY into the backend at /app/models, which is exactly where the BBA_*
# artifact paths below point.
# ---------------------------------------------------------------------------

name: behavioral-biometric-auth

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-behavioral}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-behavioral}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Deterministic one-shot migration service: applies db/migrations/*.sql in
  # lexical order (001, 002, 003) against a READY PostgreSQL. Idempotent
  # (the SQL files use CREATE TABLE IF NOT EXISTS) and fail-closed (psql
  # ON_ERROR_STOP, so any error aborts the loop with a non-zero exit and the
  # backend never starts). No migration-tracking table is created.
  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-behavioral}
    volumes:
      - ./db/migrations:/migrations:ro
    command: >
      sh -c 'set -eu;
      for f in /migrations/*.sql; do
        echo ">> applying $$f";
        psql -v ON_ERROR_STOP=1 -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f "$$f";
      done;
      echo "all migrations applied"'
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BBA_ENVIRONMENT: production
      BBA_JWT_SECRET_KEY: ${BBA_JWT_SECRET_KEY:?BBA_JWT_SECRET_KEY must be set in .env (random, >= 32 chars)}
      BBA_DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-behavioral}
      BBA_CORS_ORIGINS: ${BBA_CORS_ORIGINS:-http://localhost:3000}
      BBA_CHECKPOINT_PATH: /app/models/siamese_behavioral_encoder.pt
      BBA_PREPROCESSING_ARTIFACT_PATH: /app/models/behavioral_preprocessing.json
      BBA_VERIFICATION_CONFIG_PATH: /app/models/verification_config.json
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data: